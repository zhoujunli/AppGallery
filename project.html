<!DOCTYPE html>
<!-- 静态默认 = 玻璃 · 浅色，和 theme.css / <meta color-scheme> 对齐。
     theme.js 一执行就会按存储或系统偏好覆盖它们；脚本被关掉时页面也还有一套完整皮肤。 -->
<html lang="zh-CN" data-skin="glass" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>AppGallery — 我做过的应用</title>
<!-- 同步加载，且必须在样式表之前：它一执行就把 data-skin / data-theme 写到
     <html> 上，赶在首帧之前，否则会先闪一套再跳。详见 assets/theme.js 顶部。 -->
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/skin.css">
<!-- 同 index.html：.reveal 的起始态是透明的，靠 app.js 打 .in 显形。
     这条 noscript 兜「JS 整个没跑」，必须放在样式表之后才盖得住。 -->
<noscript><style>.reveal { opacity: 1; } [data-theme-toggle], [data-skin-toggle] { display: none; }</style></noscript>
</head>
<body data-page="detail">

<div class="bg-glow" aria-hidden="true"></div>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">App<span>Gallery</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">项目</a>
      <a href="https://github.com/zhoujunli" data-github-link>GitHub</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换明暗模式">◐</button>
      <button class="theme-toggle skin-toggle" type="button" data-skin-toggle aria-label="切换皮肤">✳</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- 找不到项目时显示，找到时移除 hidden -->
  <section class="centered" data-notfound hidden>
    <h1>找不到这个项目</h1>
    <p class="empty">链接可能过期了，或者项目已经改名。</p>
    <a class="link-accent" href="index.html">← 回到全部项目</a>
  </section>

  <div data-project>
    <a class="back reveal" href="index.html">← 全部项目</a>
    <noscript>
      <p class="empty">项目详情由脚本从 projects.js 渲染。请开启 JavaScript 后刷新。</p>
    </noscript>
    <div class="reveal" data-header></div>
    <div data-notice></div>
    <div class="detail-body">
      <div class="reveal" data-download></div>
      <div class="intro reveal" data-intro></div>
    </div>
  </div>
</main>

<footer class="wrap footer">
  <span>© <span data-year>2026</span> Junli Zhou</span>
  <a href="https://github.com/zhoujunli" data-github-link>GitHub ↗</a>
</footer>

<script src="projects.js"></script>
<script src="assets/logic.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
